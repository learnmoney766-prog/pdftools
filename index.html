<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7f6" />
    <script>
      (() => {
        let theme = 'light';
        try { if (localStorage.getItem('pdf-toolkit-theme') === 'dark') theme = 'dark'; } catch {}
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'dark' ? '#111a1c' : '#f5f7f6');
      })();
    </script>
    <meta name="description" content="Free PDF tools. Simple. Fast. Private. Merge, split, convert, and edit PDFs in your browser." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PDF Toolkit" />
    <meta property="og:title" content="Free PDF Tools | PDF Toolkit" />
    <meta property="og:description" content="Free PDF tools. Simple. Fast. Private. Work with PDFs in your browser." />
    <title>Free PDF Tools | PDF Toolkit</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
